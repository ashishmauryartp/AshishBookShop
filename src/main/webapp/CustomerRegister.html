<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Customer Registration</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar site-nav navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="home.html"><i class="bi bi-book-half"></i> Ashish Book Shop</a>
		</div>
	</nav>
	
	<div class="auth-wrap">
		<div class="container">
			<div class="auth-card">
				<div class="text-center mb-4">
					<div class="auth-icon">
						<i class="bi bi-person-plus-fill"></i>
						<span class="fw-bold mt-2">Customer Registration</span>
					</div>
					<p class="text-muted">Create your shopping account</p>
				</div>
				
				<form action="customerRegister" method="post" data-validate novalidate>
					<div class="row g-3">
						
						<div class="col-md-6">
							<label class="form-label">Username</label>
							<input class="form-control" name="uname" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Password</label>
							<input class="form-control" type="password" name="pword" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">First Name</label>
							<input class="form-control" name="fname" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Last Name</label>
							<input class="form-control" name="lname" required>
						</div>
						
						<div class="col-12">
							<label class="form-label">Address</label>
							<input class="form-control" name="addr" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Email</label>
							<input class="form-control" type="email" name="mid" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Phone</label>
							<input class="form-control" name="phno" inputmode="numeric" pattern="[0-9]{10}" required>
						</div>
						
						<div class="col-12">
							<button class="btn btn-success w-100 py-2">
								<i class="bi bi-person-plus me-2"></i>Register
							</button>
						</div>
					
					</div>
				</form>
				
				<div class="text-center mt-4">
					Already registered? <a href="CustomerLogin.html">Login Here</a>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
