<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Customer Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar site-nav navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="home.html"><i class="bi bi-book-half"></i> Ashish Book Shop</a>
		</div>
	</nav>
	
	<div class="auth-wrap">
		<div class="container">
			<div class="auth-card">
				<div class="text-center mb-4">
					<div class="auth-icon">
						<i class="bi bi-person-circle"></i>
						<span class="fw-bold mt-2">Customer Login</span>
					</div>
					<p class="text-muted">Login to continue shopping</p>
				</div>
				
				<form action="customerLogin" method="post" data-validate novalidate>
					
					<div class="mb-3">
						<label class="form-label">Username</label>
						<div class="input-group">
							<span class="input-group-text"><i class="bi bi-person"></i></span>
							<input type="text" class="form-control" name="uname" required>
						</div>
					</div>
					
					<div class="mb-3">
						<label class="form-label">Password</label>
						<div class="input-group">
							<span class="input-group-text"><i class="bi bi-lock"></i></span>
							<input id="customerPassword" type="password" class="form-control" name="pword" required>
							<button type="button" class="btn btn-outline-secondary toggle-password"	data-target="customerPassword">
								<i class="bi bi-eye"></i>
							</button>
						</div>
					</div>
					
					<button class="btn btn-primary w-100 py-2">Login</button>
				</form>
				
				<div class="text-center mt-4">
					New Customer? <a href="CustomerRegister.html">Register Here</a>
				</div>
				
				<div class="text-center mt-2">
					<a href="home.html" class="text-muted"><i class="bi bi-box-arrow-in-left me-2"></i> Back to Home</a>
				</div>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
