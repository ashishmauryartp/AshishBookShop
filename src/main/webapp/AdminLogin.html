<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Ashish Book Shop - Admin Login</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar site-nav navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="home.html"><i class="bi bi-book-half"></i> Ashish Book Shop</a>
		</div>
	</nav>
	
	<div class="auth-wrap">
		<div class="container">
			<div class="auth-card">
				
				<div class="text-center mb-4">
					<div class="auth-icon">
						<i class="bi bi-shield-lock-fill"></i>
						<span class="fw-bold mt-2">Admin Login</span>
					</div>
					<p class="text-muted">Sign in to manage books</p>
				</div>
				
				<form action="admin" method="post" data-validate novalidate>
					
					<div class="mb-3">
						<label class="form-label">Username</label>
						<input type="text" class="form-control" name="uname" required>
					</div>
					
					<div class="mb-3">
						<label class="form-label">Password</label>
						<input type="password" class="form-control" name="pword" required>
					</div>
					
					<button class="btn btn-primary w-100 py-2">
						<i class="bi bi-box-arrow-in-right me-2"></i>Login
					</button>
				</form>
				
				<div class="text-center mt-3">
					<a href="home.html" class="text-muted"><i class="bi bi-box-arrow-in-left me-2"></i> Back to Home</a>
				</div>
			</div>
		</div>
	</div>
	
	<script	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
