<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Add Book - Ashish Book Shop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="css/style.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar site-nav navbar-dark">
		<div class="container">
			<a class="navbar-brand" href="AdminLogin.jsp"><i class="bi bi-book-half"></i> Ashish Book Shop</a>
		</div>
	</nav>
	
	<div class="auth-wrap">
		<div class="container">
			<div class="auth-card">
				<div class="text-center mb-4">
					<div class="auth-icon">
						<i class="bi bi-book-half"></i>
						<span class="fw-bold mt-2">Add New Book</span>
					</div>
					<p class="text-muted">Enter the book details.</p>
				</div>
				
				<form action="add" method="post" data-validate novalidate>
					<div class="row g-3">
						
						<div class="col-md-6">
							<label class="form-label">Book Code</label>
							<input class="form-control" name="bcode" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Book Name</label>
							<input class="form-control" name="bname" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Book Author</label>
							<input	class="form-control" name="bauthor" required>
						</div>
						
						<div class="col-md-6">
							<label class="form-label">Book Price</label>
							<input class="form-control" type="number" step="0.01" min="0" name="bprice" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Book Quantity</label>
							<input class="form-control" type="number" min="0" name="bqty" required>
						</div>
				
						<div class="col-12">
							<button class="btn btn-success w-100 py-2">
								<i class="bi bi-plus-circle me-2"></i>Add Book
							</button>
						</div>
						
					</div>
				</form>
			</div>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
